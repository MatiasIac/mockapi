name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node main.js validate
      - run: npm pack --dry-run
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mockapi-test .
      - run: docker run --rm --network none mockapi-test npm test
      - run: docker run --rm --network none mockapi-test node main.js validate
